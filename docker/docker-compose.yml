# One grange: a Tailscale client sidecar and the grange in its network
# namespace (R3.2, R8.1). Fill in .env from .env.example, then `make up`.
# Build with `make up` or `make build` to capture the git metadata.
#
#   tailscale  joins the tailnet with the tagged pre-auth key, keeps its device
#              identity in a named volume, and publishes the grange's local API
#              on 127.0.0.1:${GRANGE_PORT} only (R3.3). The gossip port is never
#              published (R3.4).
#   grange     shares the sidecar's network namespace and reads its daemon
#              socket for discovery and identity checks (R6.8, R5.13).
#
# No restart policy on either service: after a reboot or a Docker restart the
# grange stays down until `make up` (R8.9).
name: agent-grange

services:
  tailscale:
    image: tailscale/tailscale:v1.104.7
    hostname: grange-${GRANGE_ID:-unset}
    cap_add: [NET_ADMIN]
    devices: ["/dev/net/tun:/dev/net/tun"]
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      # The tag comes with the pre-auth key (R9.3). The sidecar must not also
      # request it: with tag:grange owned by the admin alone (R9.1), headscale
      # refuses the registration (found in the phase 5 spike, docs/headscale.md).
      TS_EXTRA_ARGS: --login-server=${HEADSCALE_URL:-}
      TS_HOSTNAME: grange-${GRANGE_ID:-unset}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SOCKET: /var/run/tailscale/tailscaled.sock
      TS_USERSPACE: "false"
      TS_ACCEPT_DNS: "false"
      TS_AUTH_ONCE: "true"
      TS_ENABLE_HEALTH_CHECK: "true"
      TS_LOCAL_ADDR_PORT: 127.0.0.1:9002
    volumes:
      - tailscale-state:/var/lib/tailscale
      - tailscale-socket:/var/run/tailscale
    ports:
      # Fixed localhost port for farm and frolic (R3.3); never published beyond loopback.
      - "127.0.0.1:${GRANGE_PORT:-7788}:8080"
    labels:
      agent-grange.service: tailscale
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9002/healthz"]
      interval: 2s
      timeout: 3s
      retries: 3
      start_period: 60s
      start_interval: 1s

  grange:
    # Named so `make test` can run the unit tests in exactly this image.
    image: agent-grange:local
    build:
      context: .
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        GIT_BRANCH: ${GIT_BRANCH:-unknown}
        GIT_REPO: ${GIT_REPO:-unknown}
        GIT_DIRTY: ${GIT_DIRTY:-0}
        GIT_PUSHED_BASE: ${GIT_PUSHED_BASE:-}
    network_mode: service:tailscale
    depends_on:
      tailscale:
        condition: service_healthy
    volumes:
      # Read-only does not limit what a socket allows; the non-root user is the control (R8.7).
      - tailscale-socket:/var/run/tailscale:ro
    labels:
      agent-grange.service: grange
    environment:
      # Grange keys from .env (section 7). Empty means the default, which lives
      # in content/grange/config.py and is not repeated here.
      GRANGE_ID: ${GRANGE_ID:-}
      GRANGE_GOSSIP_PORT: ${GRANGE_GOSSIP_PORT:-}
      GRANGE_GROUP: ${GRANGE_GROUP:-}
      TS_TAG: ${TS_TAG:-}
      GRANGE_PEERS: ${GRANGE_PEERS:-}
      HEARTBEAT_SECONDS: ${HEARTBEAT_SECONDS:-}
      FARM_STALE_SECONDS: ${FARM_STALE_SECONDS:-}
      EXPIRE_SECONDS: ${EXPIRE_SECONDS:-}
      FORGET_SECONDS: ${FORGET_SECONDS:-}
      REPAIR_SECONDS: ${REPAIR_SECONDS:-}
      DISCOVERY_SECONDS: ${DISCOVERY_SECONDS:-}
      FANOUT: ${FANOUT:-}
      CONNECT_TIMEOUT_SECONDS: ${CONNECT_TIMEOUT_SECONDS:-}
      EXCHANGE_TIMEOUT_SECONDS: ${EXCHANGE_TIMEOUT_SECONDS:-}

      # needed for private repos
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}

      GITHUB_API_URL: ${GITHUB_API_URL:-https://api.github.com}

      # the tag the team advances to mark the current build
      CHECK_TAG: ${CHECK_TAG:-agent-grange-latest}

      # 1 = refuse if the tag is missing or GitHub cannot be reached; 0 = warn and start
      FRESHNESS_STRICT: ${FRESHNESS_STRICT:-1}

      # 1 = skip the check entirely
      SKIP_FRESHNESS_CHECK: ${SKIP_FRESHNESS_CHECK:-0}

      # how often the running server polls the tag (ETag conditional GET: a 304 is free);
      # stale -> 503 on every route -> unhealthy
      RECHECK_SECONDS: ${RECHECK_SECONDS:-30}

    # healthcheck.py prints why /health failed, so the reason lands in Docker's health log.
    # The start period covers the 60-second tailnet wait plus startup (R6.1, R8.1);
    # after that 3 misses = unhealthy.
    healthcheck:
      test: ["CMD", "python3", "/app/healthcheck.py"]
      interval: 2s
      timeout: 3s
      retries: 3
      start_period: 75s
      start_interval: 1s

volumes:
  tailscale-state:
  tailscale-socket:
