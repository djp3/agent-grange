# Headscale for local testing only (R3.5): this repo never deploys the team's
# server. Pinned to the image in compose.headscale.yml. TLS comes from a
# throwaway CA the `certs` step generates, so the control connection and the
# embedded relay behave as they will against a real server.
server_url: https://headscale:443
listen_addr: 0.0.0.0:443
metrics_listen_addr: 127.0.0.1:9090
grpc_listen_addr: 127.0.0.1:50443
grpc_allow_insecure: false

noise:
  private_key_path: /var/lib/headscale/noise_private.key

prefixes:
  v4: 100.64.0.0/10
  v6: fd7a:115c:a1e0::/48
  allocation: sequential

# The embedded relay, and nothing from Tailscale's public DERP map, so the
# stack works offline.
derp:
  server:
    enabled: true
    region_id: 999
    region_code: "local"
    region_name: "agent-grange local test relay"
    verify_clients: true
    stun_listen_addr: "0.0.0.0:3478"
    private_key_path: /var/lib/headscale/derp_server_private.key
    automatically_add_embedded_derp_region: true
    ipv4: 172.29.207.10
  urls: []
  paths: []
  auto_update_enabled: false

disable_check_updates: true

node:
  expiry: 0

database:
  type: sqlite
  sqlite:
    path: /var/lib/headscale/db.sqlite
    write_ahead_log: true

tls_cert_path: /certs/headscale.crt
tls_key_path: /certs/headscale.key

log:
  level: info
  format: text

policy:
  mode: file
  path: /etc/headscale/policy.hujson

dns:
  magic_dns: false
  override_local_dns: false
  nameservers:
    global: []

unix_socket: /var/run/headscale/headscale.sock
unix_socket_permission: "0770"

logtail:
  enabled: false
taildrop:
  enabled: false
